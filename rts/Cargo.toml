[workspace]

[package]
name = "meadow-rts"
description = "The Meadow runtime system: a register bytecode VM with a Cheney semispace collector. It executes straight-line bytecode and knows nothing about the IR that produced it."
version = "0.2.0"
edition = "2024"

[lib]
name = "meadow_rts"
path = "src/lib.rs"

[dependencies]
meadow-bytecode = { path = "../compiler/meadow-bytecode" }
meadow-core = { path = "../compiler/meadow-core" }
meadow-intern = { path = "../compiler/meadow-intern" }
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
# The differential tests need the front end to get a `core::Program` from
# source, the AxCut back end to turn one into bytecode, and the CEK machine to
# say what the answer should be.
meadow-compiler = { path = "../compiler/meadow-compiler" }
meadow-seq = { path = "../compiler/meadow-seq" }
meadow-codegen = { path = "../compiler/meadow-codegen" }
meadow-eval = { path = "../eval" }
meadow-bytecode = { path = "../compiler/meadow-bytecode" }

# Same reasoning as `buildtools`: this crate *is* the inner loop. It matters
# here too because `cargo test --release` in this workspace is where the VM is
# measured.
[profile.release]
lto = true
codegen-units = 1
