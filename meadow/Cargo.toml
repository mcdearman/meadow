[workspace]

[package]
name = "meadow"
description = "The Meadow build system (package discovery, pipeline, linker, embedded stdlib) plus the CLI and REPL. Its own workspace."
version = "0.1.0"
edition = "2024"

[[bin]]
name = "meadow"
path = "src/main.rs"

[dependencies]
meadow-compiler = { path = "../compiler/meadow-compiler" }
meadow-eval = { path = "../eval" }
chumsky = { version = "0.13.0", features = ["pratt"] }
clap = { version = "4.6.1", features = ["cargo", "derive"] }
env_logger = "0.11.10"
itertools = "0.14.0"
rustyline = { version = "18.0.0", features = ["with-file-history", "derive", "custom-bindings"] }

[dev-dependencies]
insta = "1.47.2"
