# The tests compile programs, and run them on the reference interpreter, on
# the test harness's own threads, which have 2 MB stacks by default. Both walk
# a program recursively, so a deep one -- three hundred nested `let`s, as the
# register-spilling cases in `tests/differential.rs` are -- needs more, as it
# gets from the `meadow` binary (see `STACK` in `buildtools/meadow/src/main.rs`).
# Address space, committed only as deep as a test goes.
[env]
RUST_MIN_STACK = "268435456"
