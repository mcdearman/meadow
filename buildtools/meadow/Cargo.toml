[package]
name = "meadow"
description = "The Meadow build system (package discovery, pipeline, linker, embedded stdlib) plus the CLI and REPL."
version.workspace = true
edition.workspace = true

[[bin]]
name = "meadow"
path = "src/main.rs"

[dependencies]
meadow-compiler.workspace = true
meadow-eval.workspace = true
meadow-rts.workspace = true
meadow-seq.workspace = true
meadow-codegen.workspace = true
meadow-bytecode.workspace = true
meadow-fmt.workspace = true
meadow-lsp.workspace = true
chumsky = { version = "0.13.0", features = ["pratt"] }
clap = { version = "4.6.1", features = ["cargo", "derive"] }
env_logger = "0.11.10"
itertools = "0.14.0"
yansi = { version = "1.0", features = ["detect-tty", "detect-env"] }
rustyline = { version = "18.0.0", features = ["with-file-history", "derive", "custom-bindings"] }

[dev-dependencies]
insta = "1.47.2"
