# Build `meadow` for every supported platform and attach the archives to a
# GitHub Release, plus `meadowup-*.exe` — the double-clickable Windows
# installer built from `installer/`.
#
# Asset names carry no version, so the installers can use the
# `/releases/latest/download/...` redirect and never need to know the tag.
#
# Cut a release by pushing a tag. While the language is in alpha there is one
# release, `v0.1.0-alpha`, republished by moving its tag:
#
#     git tag -f v0.1.0-alpha && git push -f origin v0.1.0-alpha
#
# A manual run builds everything and leaves the archives as workflow artifacts
# without publishing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is published until this passes. It runs the same `scripts/check.sh`
  # as `ci.yml`, plus the version check — the only thing a tag can get wrong that
  # a branch cannot, since the release assets carry no version and nothing
  # downstream would notice a tag that disagreed with the manifests.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable
      # `check.sh` builds the VS Code extension when npm is present. Pinned
      # rather than left to whatever the runner ships, for the same reason
      # `vsce` is pinned: an implicit tool version is a build that breaks on
      # someone else's schedule.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            bash scripts/check.sh --version "${{ github.ref_name }}"
          else
            bash scripts/check.sh
          fi

  build:
    name: ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      # The CLI lives in the `buildtools/` workspace.
      - name: Build
        working-directory: buildtools
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      # Skip on the cross-compiled targets, which cannot run on the runner.
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: buildtools
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/meadow"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          echo 'def main = 6 * 7' > /tmp/smoke.mw
          "$bin" run /tmp/smoke.mw | tail -1 | grep -q '=> 42'
          # A release build is a native executable, linked against the runtime
          # built into the binary; `--aot` makes falling back an error.
          bin="$PWD/$bin"
          "$bin" init "$RUNNER_TEMP/smokepkg"
          (cd "$RUNNER_TEMP/smokepkg" && "$bin" run --release --aot . | tail -1 | grep -q 'Hello, world!')

      # `meadowup`, the toolchain manager, and on Windows the double-clickable
      # bootstrap beside it. Its own workspace -- it depends on no Meadow crate,
      # since it has to work before Meadow is installed at all.
      - name: Build meadowup
        working-directory: installer
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      # Two things are published per target. `meadowup-<target>` on its own is
      # what a person downloads, and what `install.sh` fetches: it is small, and
      # it is the only thing needed to get started. The archive beside it is the
      # whole toolchain, which `meadowup install` pulls -- with meadowup in it
      # too, so an update replaces meadowup along with the build tool and a
      # machine cannot be left holding one too old to update what it manages.
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          staging="$RUNNER_TEMP/pkg"
          mkdir -p "$staging"
          cp "buildtools/target/${{ matrix.target }}/release/meadow" "$staging/"
          cp "installer/target/${{ matrix.target }}/release/meadowup" "$staging/"
          tar -czf "$GITHUB_WORKSPACE/meadow-${{ matrix.target }}.tar.gz" -C "$staging" meadow meadowup
          cp "$staging/meadowup" "$GITHUB_WORKSPACE/meadowup-${{ matrix.target }}"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The archive `meadowup install` pulls: the build tool and meadowup.
          Compress-Archive `
            -Path buildtools/target/${{ matrix.target }}/release/meadow.exe, `
                  installer/target/${{ matrix.target }}/release/meadowup.exe `
            -DestinationPath meadow-${{ matrix.target }}.zip
          # And meadowup on its own -- the thing to download and double-click,
          # under a name that says which machine it is for.
          $arch = '${{ matrix.target }}'.Split('-')[0]
          Copy-Item installer/target/${{ matrix.target }}/release/meadowup.exe `
            "meadowup-$arch.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: meadow-${{ matrix.target }}
          path: |
            meadow-${{ matrix.target }}.tar.gz
            meadow-${{ matrix.target }}.zip
            meadowup-${{ matrix.target }}
            meadowup-*.exe
          if-no-files-found: error

  # The VS Code extension. Platform-independent, so it is built once rather than
  # per target, and attached alongside the binaries.
  extension:
    name: vsix
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: editors/vscode/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    needs: [build, extension]
    runs-on: ubuntu-latest
    # Only a tag push publishes. A manual run still builds every target and
    # leaves the archives as workflow artifacts, which is what you want when
    # testing the matrix without cutting a release.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A moved tag republishes: the release already there, with its old
      # assets, goes first, so nothing from the previous build is left behind
      # or collides with an upload. The tag itself stays -- it was just pushed.
      - name: Replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            **Windows** — download **`meadowup-x86_64.exe`** below and run it.
            (On an ARM machine take `meadowup-aarch64.exe`.) It installs itself
            and the toolchain, and adds them to your `PATH`; open a new terminal
            afterwards.

            **macOS / Linux**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | sh
            ```

            Then `meadow` starts the REPL and `meadow run <path>` builds and runs
            a package, while `meadowup update` brings the toolchain forward --
            the two split the way `cargo` and `rustup` do.

            **VS Code** — download **`meadow-*.vsix`** below and install it with
            *Extensions: Install from VSIX…*, or:

            ```sh
            code --install-extension meadow-0.1.0-alpha.vsix
            ```

            It gives you syntax highlighting on its own, and diagnostics, hover,
            go-to-definition and inlay hints once `meadow` is on your `PATH` —
            the extension runs `meadow lsp`.
